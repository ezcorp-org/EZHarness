# Dev stack. Runs on Docker as-is; for Podman use `bun run podman <args>`,
# which layers `compose.podman.yml` on top (see docs/deployment.md §Podman).
# That override is REQUIRED under Podman — the `tmpfs:` secret masks below
# fail open without it. The boot-time guard in the app `command:` enforces it.
#
# Image names are fully qualified (docker.io/...) so this file resolves the
# same way on a host whose containers/registries.conf has no
# unqualified-search-registries configured. Harmless under Docker.
services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ezcorp
      POSTGRES_USER: ezcorp
      POSTGRES_PASSWORD: ezcorp
    ports:
      - "5432:5432"
    volumes:
      - testenv-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezcorp"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # `network_mode: host` is dev-only convenience: it lets the dev's
    # browser hit the SvelteKit dev server on localhost without port
    # mapping. Production deployments use isolated container networking
    # (default Docker bridge / Kubernetes NetworkPolicy) — Phase 7's
    # MCP namespace + forward-proxy stack is designed to work alongside
    # that, NOT to depend on host networking. See `docs/deployment.md`
    # §"Container networking" for the production layout.
    network_mode: host
    environment:
      - DATABASE_URL=postgres://ezcorp:ezcorp@localhost:5432/ezcorp
      - EZCORP_PORT=3000
      # ORIGIN must match the URL the browser actually loads — hardcoding
      # `localhost:3000` while the user accesses via Tailscale (or any
      # other hostname) makes SvelteKit's url.origin disagree with the
      # cookie's effective host, which can cascade into "logged out
      # every few minutes" symptoms when the browser scopes the cookie
      # to a domain that subsequent requests don't match. Falls back to
      # localhost for the bare-localhost dev case.
      - ORIGIN=${EZCORP_PUBLIC_URL:-http://localhost:3000}
      - HF_HOME=/app/cache/huggingface
      # Stable encryption keys — credentials survive across re-seeds.
      # Values loaded from .env (gitignored, never committed).
      - EZCORP_ENCRYPTION_SECRET=${EZCORP_ENCRYPTION_SECRET}
      - EZCORP_ENCRYPTION_SALT=${EZCORP_ENCRYPTION_SALT}
      # Stable JWT secret. If unset, src/auth/jwt.ts auto-generates one
      # and stores it (encrypted) in the DB. Any transient
      # decrypt-failure trips the legacy plaintext fallback and silently
      # rotates the secret — every active JWT then fails verification
      # and the user is bounced to /login. Pin explicitly.
      - EZCORP_JWT_SECRET=${EZCORP_JWT_SECRET}
      # Public origin for clickable deep-links in ai-kit tool responses.
      - EZCORP_PUBLIC_URL=${EZCORP_PUBLIC_URL:-}
      # Long-life session for dev parity with prod.
      - EZCORP_SESSION_LIFETIME_DAYS=${EZCORP_SESSION_LIFETIME_DAYS:-180}
      - EZCORP_SESSION_REFRESH_AFTER_DAYS=${EZCORP_SESSION_REFRESH_AFTER_DAYS:-7}
      - EZCORP_SESSION_PREVIOUS_TOKEN_GRACE_SECONDS=${EZCORP_SESSION_PREVIOUS_TOKEN_GRACE_SECONDS:-60}
      # Inverts the EZCorp logo across the UI (splash, login, error pages)
      # so it's obvious at a glance that you're hitting the dev stack and
      # not prod. Read by hooks.server.ts -> transformPageChunk.
      - EZCORP_DEV_INDICATOR=1
      # Zero-setup web search: points the bundled web-search extension at
      # the SearXNG sidecar below. The app is host-network, so Docker DNS
      # names don't resolve for it — use the localhost-published port.
      #
      # `127.0.0.1`, NOT `localhost`: the sidecar publishes on IPv4 only
      # (`127.0.0.1:8889:8080` below), but `localhost` resolves to `::1`
      # first on a dual-stack host. Unlike a plain `fetch` (which happy-
      # eyeballs to the next address), the SSRF guard resolve-and-PINS one
      # address — it pinned `[::1]:8889`, got connection-refused, and every
      # search silently fell back to DuckDuckGo, so the sidecar was never
      # used. `EZCORP_SUGGEST_OLLAMA_URL` below is a plain fetch and is
      # unaffected. See src/search/egress.ts#pickPinnedAddress.
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://127.0.0.1:8889}
      # Composer suggestions: local model endpoint for the prompt-enhancement
      # half (the tool-suggestion half is in-process embeddings and needs no
      # sidecar). Same host-network reasoning as SEARXNG_BASE_URL — use the
      # loopback-published port of the ollama service below. The app degrades
      # gracefully when unreachable (enhancement row hides).
      - EZCORP_SUGGEST_OLLAMA_URL=${EZCORP_SUGGEST_OLLAMA_URL:-http://localhost:11434}
      # 1B-class is the CPU-viable default; GPU boxes can swap in a larger
      # tier (e.g. qwen3:4b) — ollama-init pulls whatever is set here.
      - EZCORP_SUGGEST_MODEL=${EZCORP_SUGGEST_MODEL:-qwen3:1.7b}
      # Self-modification: boot-seeds the 'self' project pointing at this
      # checkout (mounted at /repo below) so an in-app agent can dogfood the
      # platform on its own source. Dev-only — never set in prod/test/CI.
      # See src/db/seed-self-project.ts.
      - EZCORP_SELF_PROJECT_PATH=/repo
      # Root-run git against the host-uid-owned /repo trips git's
      # dubious-ownership check — safe.directory clears it. The identity
      # entries make any future in-container commit attributable. GIT_CONFIG_*
      # env survives every spawn path (chat shell tool, extension runners).
      #
      # safe.directory is load-bearing under DOCKER and merely redundant
      # under rootless Podman: Podman maps the invoking uid to container uid
      # 0, so /repo's owner and git's euid already agree and the check never
      # fires. Verified both ways — bare `git log` in the bind fails with
      # "detected dubious ownership" under Docker and succeeds under Podman.
      # Keep the entry: it is harmless where it is unnecessary, and dropping
      # it would break every Docker user.
      - GIT_CONFIG_COUNT=3
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/repo
      - GIT_CONFIG_KEY_1=user.name
      - GIT_CONFIG_VALUE_1=${EZCORP_GIT_NAME:-EZCorp Dev}
      - GIT_CONFIG_KEY_2=user.email
      - GIT_CONFIG_VALUE_2=${EZCORP_GIT_EMAIL:-dev@ezcorp.local}
    command:
      - sh
      - -c
      - |
        # Fail-closed check on the `tmpfs:` secret masks (see the block
        # below the volume list). They hide the prod PGlite DB/keys and the
        # multi-GB agent-scratch worktrees from this container, and they are
        # a BLACKLIST — when one fails it fails OPEN and nothing complains.
        # That is not hypothetical: Podman seeds a tmpfs with the directory
        # underneath it (`tmpcopyup`) unless `compose.podman.yml` is layered
        # on, so a plain `docker compose -f docker-compose.yml up` against a
        # Podman socket silently exposes both trees. Assert the masks landed
        # rather than trusting that they were declared.
        #
        # The paths here MUST match the `tmpfs:` list —
        # src/__tests__/compose-podman-masks.test.ts holds the two together.
        # Doubled dollar signs below are deliberate: Compose interpolates
        # single-dollar references (even inside these comments) and would
        # substitute the loop variable away to an empty string before sh ever
        # sees it — which silently makes the check pass unconditionally.
        for masked in /repo/.ezcorp /repo/worktrees; do
          if [ -n "$$(ls -A "$$masked" 2>/dev/null)" ]; then
            echo "FATAL: $$masked is not empty inside the container." >&2
            echo "       Its tmpfs mask is not in effect, so host secrets or" >&2
            echo "       the agent-scratch tree are exposed to this container." >&2
            echo "       On Podman, start the stack with:  bun run podman up -d" >&2
            echo "       (layers compose.podman.yml, which adds notmpcopyup)." >&2
            echo "       See docs/deployment.md section 'Running under Podman'." >&2
            exit 1
          fi
        done
        # Reconcile deps with the committed lockfile BEFORE anything else.
        # node_modules is baked into the dev image (it is NOT bind-mounted),
        # so when a merged PR advances bun.lock — e.g. the pi-ai 0.79→0.80
        # bump that moved imports to the new `@earendil-works/pi-ai/compat`
        # subpath — the running image keeps serving the OLD deps against the
        # freshly bind-mounted ./src. Vite then can't resolve the new subpath
        # and every route 500s with a cryptic "Missing ./compat specifier".
        # The manifests + lockfiles are bind-mounted read-only below, so this
        # install sees the CURRENT committed versions; on an up-to-date image
        # Bun verifies the install and exits fast (no-op). --ignore-scripts
        # mirrors Dockerfile.dev (dev runs raw .ts via Bun's "bun" export
        # condition — no dist/ build needed). Must run before the seed step,
        # which imports app code that transitively imports pi-ai.
        echo "Reconciling dependencies with lockfile..."
        bun install --frozen-lockfile --ignore-scripts
        (cd web && bun install --frozen-lockfile --ignore-scripts)
        if [ ! -f /app/state/.seeded ]; then
          echo "Seeding database..."
          bun src/db/seed-marketplace.ts && touch /app/state/.seeded
          echo "Seeding complete."
        else
          echo "Database already seeded, skipping."
        fi
        cd web && bunx svelte-kit sync && cd ..
        exec bun run dev -- --port 3000
    volumes:
      - testenv-state:/app/state
      - model-cache:/app/cache
      # Persist extension-generated files (openai-image-gen-2 writes PNG/WEBP
      # here; rehydrator reads them back on subsequent turns so the model
      # can describe/edit prior images). The dev server runs with
      # cwd=/app/web (see `cd web && bun run dev` above), so
      # saveImageToDisk resolves <cwd>/.ezcorp/ to this path. Without the
      # mount, every container restart wipes the images and the tool-card
      # URLs 404 silently.
      - ext-data:/app/web/.ezcorp
      # Scoped host bind mounts for extension state: authored/installed
      # extensions and their persistent extension-data land in the host
      # tree at ./.ezcorp/ so they're editable/inspectable from the host.
      #
      # Target is /app/.ezcorp — NOT /app/web/.ezcorp. Extension state is
      # anchored to getProjectRoot() (src/extensions/bundled.ts), which
      # resolves via an `import.meta.dir` that contains src/extensions and
      # so returns the dir holding src/ — i.e. /app. registry.ts injects
      # that value into every sandbox as EZCORP_EXTENSION_DATA_ROOT, and
      # author-install.ts derives installedPath from the same root. It is
      # deliberately NOT process.cwd(), which is /app/web under the
      # vite-SSR dev server — that mismatch is exactly what these mounts
      # got wrong before: /app/.ezcorp lived only in the container overlay,
      # so every `docker compose up`/recreate silently wiped the sandbox
      # extension-data written there while these binds sat unwritten.
      #
      # The other half of that split was in the CODE, not here:
      # db/queries/ez-drafts.ts resolved draft dirs from process.cwd(), so
      # author-install.ts installed authored extensions to
      # /app/web/.ezcorp/extensions/<name>. It now uses getProjectRoot(),
      # so installs and this bind finally agree. Moving the mount without
      # that change would just have had the next authored install recreate
      # the stale path.
      # compose.prod.yml already targets /app/.ezcorp (prod WORKDIR=/app);
      # dev now matches it. src/__tests__/compose-extension-state-root.test.ts
      # locks the invariant.
      #
      # The ext-data volume above stays at /app/web/.ezcorp on purpose —
      # it backs the cwd-anchored generated-image store, .ezcorp/data, and
      # the daemon `.pid` lockfiles, all of which really are relative to
      # cwd=/app/web. Do not merge the two.
      #
      # Those `.pid` files (schedule-daemon, host-maintenance-daemon,
      # embed-worker, preview-port-watcher) sit at the volume ROOT, not
      # under extension-data/ — each daemon declares a cwd-relative
      # `.ezcorp/<name>.pid`. So they stay volume-backed and unbound, as
      # before: sharing them across the host/container PID namespace would
      # cause false "daemon already running" detection. Moving these two
      # binds does not reach them.
      #
      # `.ezcorp/` is gitignored.
      #
      # HOST OWNERSHIP OF CONTAINER-CREATED FILES — the canonical note; the
      # /repo mount below refers back here. The container runs as uid 0, and
      # what that means on the host depends on the runtime:
      #
      #   Docker            uid 0 IS host root. Files the container creates
      #                     here land ROOT-OWNED on the host — you need sudo
      #                     to manage them, and the host tree (owned by your
      #                     uid) appears foreign inside the container.
      #   rootless Podman   INVERTED. uid 0 maps to the uid that invoked
      #                     podman, so created files land owned by YOU and
      #                     need no sudo; conversely the host tree shows up
      #                     inside the container as uid 0.
      #
      # Measured, not assumed: same `alpine` container writing into the same
      # bind produced a root-owned file under Docker and a dev-owned file
      # under rootless Podman. Nothing here depends on which way it falls, so
      # the stack needs no --userns=keep-id; only the sudo-or-not ergonomics
      # differ, and this note exists so the difference isn't a surprise.
      - ./.ezcorp/extensions:/app/.ezcorp/extensions
      - ./.ezcorp/extension-data:/app/.ezcorp/extension-data
      # SECOND target for the SAME host extension-data tree, at the
      # cwd-anchored root. Not redundant, and not a mistake — three
      # host-side consumers still resolve extension-data from
      # `process.cwd()` (= /app/web) rather than getProjectRoot():
      #
      #   src/chat/attachments/ext-files-resolver.ts  extensionDataRoot()
      #     → GET /api/ext-files/<name>/<path>        (tool-card images)
      #     → GET /api/extensions/<name>/data/<path>
      #     → src/runtime/stream-chat/load-history.ts (image rehydrate)
      #   docs/extensions/examples/openai-image-gen-2/image-storage.ts
      #     saveImageToDisk() — writes via the same cwd default
      #
      # Binding /app/.ezcorp/extension-data ALONE would leave those
      # reading /app/web/.ezcorp/extension-data, which reverts to the
      # ext-data volume — whose extension-data/ subdir is an empty
      # mountpoint stub (verified). Every already-generated image would
      # 404 and each new one would land in the volume instead of the
      # host tree. Two targets, one host tree, so both roots agree.
      #
      # DELETE THIS LINE once those consumers take getProjectRoot() the
      # way src/db/queries/ez-drafts.ts now does — then /app/.ezcorp is
      # the single root again.
      - ./.ezcorp/extension-data:/app/web/.ezcorp/extension-data
      # User-created project workspaces, host-visible at ./.ezcorp/projects/.
      #
      # THE SAME container path is used by compose.prod.yml, deliberately.
      # `projects.path` stores an ABSOLUTE container path, so a database
      # copied between stacks only resolves if both agree on it. That is
      # not theoretical: compose.prod.localtest.yml existed purely to
      # re-mount `/app/projects` because a dev-DB copy's rows pointed
      # there, and a missing cwd surfaces as `posix_spawn '/bin/sh' —
      # ENOENT`, which reads like a broken image. One path, every stack.
      #
      # The container side is NOT a free choice — it is pinned by three
      # independent constraints that only this path satisfies:
      #
      #   1. It must be under the dev server's cwd (/app/web). `POST
      #      /api/fs/mkdir` and `GET /api/fs/list` sandbox on
      #      `EZCORP_PROJECT_ROOT ?? process.cwd()`, and that env var is
      #      unset here, so anything outside /app/web is a hard 403. The
      #      form's old `/app/projects/` default could not even be created
      #      by its own "Create folder" button.
      #   2. It must ALSO be under the prod cwd (/app — Dockerfile WORKDIR,
      #      `CMD ["bun","run","web/build/index.js"]`), for the same fs-API
      #      reason on the prod stack. /app/web/... satisfies both because
      #      /app/web is strictly inside /app. Note the tempting shortcut —
      #      setting EZCORP_PROJECT_ROOT=/app here so both cwds agree — is
      #      a SECURITY REGRESSION: it widens the dev fs jail from /app/web
      #      to /app, exposing /app/.ezcorp/data (the live DB) to
      #      /api/fs/list. Don't.
      #   3. It must be under a `.ezcorp` path segment. Vite's dev watcher
      #      ignores `**/.ezcorp/**` (web/vite.config.ts) — without that a
      #      project's build output (a Rust `target/`, node_modules) is
      #      watched, and HMR churns on every rebuild.
      #
      # Why this matters: a path that satisfies neither silently lands in
      # the container's throwaway overlay, invisible on the host and gone
      # on the next recreate. That is not hypothetical — a project cloned
      # to the literal path `~/projects/<name>` (nothing expands `~`, so
      # `resolve()` rooted it at cwd) put 270 MB and two unpushed commits
      # in /app/web/~/projects/. src/__tests__/compose-projects-root.test.ts
      # holds this bind against BOTH constraints and against the form's
      # default value.
      #
      # Sibling of `.ezcorp/data`, never an ancestor — the sandbox jail's
      # forbidden-path rules are unaffected (see the landlock note in
      # src/extensions/sandbox/landlock.ts).
      - ./.ezcorp/projects:/app/web/.ezcorp/projects
      # NOTE: a `./.env.seed:/app/.env.seed:ro` bind mount used to live
      # here so re-seeds could restore OAuth tokens. It's gitignored,
      # so on fresh clones Docker created an empty directory at the
      # host path and the seed step crashed reading it as a file. If
      # you actually rely on the seed-restore flow, re-add the line
      # locally — the seed script (src/db/seed-marketplace.ts) no-ops
      # cleanly when the file is absent.
      # Dependency manifests + lockfiles, read-only. Bind-mounting these lets
      # the boot-time `bun install --frozen-lockfile` (see command: above)
      # reconcile the image's baked node_modules against the CURRENT committed
      # lockfile. Without them the container would only ever see the lockfile
      # snapshot baked at image-build time and silently run stale deps against
      # newer bind-mounted source. :ro is safe — --frozen-lockfile never
      # rewrites the lockfile (it fails loudly if the manifests disagree).
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock:ro
      - ./web/package.json:/app/web/package.json:ro
      - ./web/bun.lock:/app/web/bun.lock:ro
      # Workspace manifests must match the lockfile for `workspace:*` to
      # resolve during the frozen install (same set Dockerfile.dev COPYs).
      - ./packages/@ezcorp/sdk/package.json:/app/packages/@ezcorp/sdk/package.json:ro
      - ./packages/@ezcorp/ai-kit/package.json:/app/packages/@ezcorp/ai-kit/package.json:ro
      - ./packages/@ezcorp/harness-client/package.json:/app/packages/@ezcorp/harness-client/package.json:ro
      # Mount source for live reload (Vite HMR)
      - ./src:/app/src
      - ./web/src:/app/web/src
      - ./web/static:/app/web/static
      - ./web/svelte.config.js:/app/web/svelte.config.js
      - ./web/vite.config.ts:/app/web/vite.config.ts
      - ./web/tsconfig.json:/app/web/tsconfig.json
      - ./docs:/app/docs
      # The bundled-extension lockfile must ride the same live-reload set,
      # for the same reason as the SDK mount below. `ensureBundledExtensions`
      # verifies every bundled manifest against manifest.lock.json on each
      # boot; with ./src + ./docs bind-mounted but the lockfile baked at
      # image-build time, adding or changing a bundled extension makes the
      # CURRENT manifest disagree with the STALE lock. That reads as
      # "Manifest tamper detected — no lockfile entry" and auto-disables the
      # extension, which looks exactly like a broken extension rather than a
      # stale container. :ro is safe — the host only ever reads it.
      - ./manifest.lock.json:/app/manifest.lock.json:ro
      # SDK source must ride the same live-reload set: extension
      # subprocesses resolve the workspace SDK through its "bun" exports
      # condition to packages/@ezcorp/sdk/src/*.ts, so without this
      # mount they run the image-baked SDK snapshot against bind-mounted
      # CURRENT extension/host code. That skew crashed every extension
      # importing an SDK export newer than the image (auto-disabled
      # after 3 crashes → its hub page 404s).
      - ./packages/@ezcorp/sdk/src:/app/packages/@ezcorp/sdk/src
      # NOTE: `./projects:/app/projects` used to live here. It is GONE, and
      # re-adding it is a regression: /app/projects sits outside the fs-API
      # sandbox root (/app/web), so the form's own "Create Folder" button
      # answered 403 on it, and it is outside `**/.ezcorp/**` so project
      # build output churned Vite's watcher. Project workspaces now live on
      # the ./.ezcorp/projects bind above, which every stack shares.
      # ── Self-modification project (EZCORP_SELF_PROJECT_PATH) ─────────
      # Whole checkout rw, including everything the scoped mounts above
      # don't cover. Shares inodes with ./src and ./web/src, so agent edits
      # write through to the host tree and Vite HMR fires unchanged. Files
      # the agent CREATES here follow the runtime-dependent ownership rule
      # documented at the .ezcorp bind above (root-owned under Docker,
      # your-uid-owned under rootless Podman); edits to EXISTING files keep
      # their owner either way.
      - .:/repo
      # Read-only .git: git diff/log/status work for agent context, but
      # commits/branches/stashes fail with EROFS — keeps root-owned
      # objects/refs out of the host repo. Committing is a host-side action.
      - ./.git:/repo/.git:ro
      # Secret masks. Files use /dev/null binds (tmpfs can't mask a single
      # file); dirs use the tmpfs list below. ./.ezcorp holds the PROD
      # stack's live PGlite DB + keys; .env* hold deploy secrets. On hosts
      # where a mask target doesn't exist, docker creates an empty
      # root-owned file/dir at the host path (gitignored, harmless).
      - /dev/null:/repo/.env:ro
      - /dev/null:/repo/.env.prod:ro
      - /dev/null:/repo/.env.seed:ro
    tmpfs:
      # Mask the prod DB/keys dir and the multi-GB agent-scratch worktrees
      # out of /repo (mounts nest by target-path depth — same mechanism as
      # the .ezcorp bind-over-volume layering above).
      #
      # RUNTIME CAVEAT — these masks are the one thing in this file that does
      # NOT behave the same on Docker and Podman. Docker gives an empty
      # tmpfs. Podman defaults tmpfs mounts to `tmpcopyup`, which SEEDS the
      # tmpfs with the contents of the directory underneath — i.e. with
      # exactly what the mask exists to hide. Under Podman that means the
      # prod PGlite DB/keys become readable in-container, and the copy-up
      # targets a RAM-backed fs, so a large worktrees/ tree (13 GB on the
      # primary dev box) is copied into memory at container start.
      # `compose.podman.yml` re-declares both entries with `notmpcopyup` to
      # restore Docker's semantics; `bun run podman` layers it automatically.
      # Docker REJECTS `notmpcopyup` outright ("invalid tmpfs option"), which
      # is why it lives in an override rather than here.
      #
      # A blacklist mask fails OPEN, so the app `command:` re-verifies both
      # paths are empty at boot and exits non-zero if not. Do not rely on the
      # declaration alone.
      #
      # size= caps the mask. Nothing should legitimately write here — these
      # are hiding places, not scratch space — and the tmpfs default is half
      # of host RAM, which is not a bound worth having next to a 13 GB tree.
      # NOTE: `compose.podman.yml` REPLACES this whole list (YAML `!override`,
      # because compose otherwise APPENDS and then errors on the duplicate
      # target), so any option added here must be repeated there or it is
      # silently dropped under Podman. A test locks that.
      - /repo/.ezcorp:size=16m
      - /repo/worktrees:size=64m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Zero-setup web search backend for the bundled web-search extension.
  # Always-on with hard resource caps (user decision 2026-06-12): an
  # on-demand spin-up was rejected because it needs docker.sock exposure
  # to save ~140 MB idle RAM. The app falls back to keyless DuckDuckGo
  # if this service is down, so it is NOT a hard dependency (no
  # depends_on). The port publishes on loopback ONLY — the app reaches
  # it via host networking; nothing off-host can.
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:8889:8080"
    volumes:
      # Committed config enabling the JSON API (off upstream by default)
      # and disabling the bot limiter (internal-only service).
      - ./deploy/searxng:/etc/searxng:ro
    environment:
      # The image maps SEARXNG_SECRET onto server.secret_key — the real
      # secret never lives in the committed settings.yml. The dev default
      # is fine because the port is loopback-only.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-dev-only-secret}

  # Local suggestion model for the composer's prompt-enhancement row.
  # Same optional-sidecar contract as searxng: always-on with hard resource
  # caps, loopback-only port, and deliberately NO depends_on — the app falls
  # back (tool chips stay embedding-only, the ✨ row hides) whenever this
  # service is down or removed. Model weights persist in the named volume,
  # so the ~1GB download happens once.
  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot puller: fetches the suggestion model on first `up`, then exits
  # (restart "no"). Idempotent — `ollama pull` no-ops when the tag is
  # already current in the shared volume.
  ollama-init:
    image: docker.io/ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${EZCORP_SUGGEST_MODEL:-qwen3:1.7b}"]

volumes:
  testenv-pgdata:
  testenv-state:
  model-cache:
  ext-data:
  ollama-models:
