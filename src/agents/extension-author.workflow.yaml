name: extension-author
description: Build an extension workspace and return the operation for review. A user approves the exact release before activation.
inputSchema:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    idempotencyKey:
      type: string
  required: [name, description, idempotencyKey]
steps:
  - name: workspace
    kind: tool
    tool: extensions_workspace
    input:
      action: create
      name: $input.name
      description: $input.description
  - name: build
    kind: tool
    tool: extensions_build
    input:
      installationId: $steps.workspace.output.installation.id
      workspaceId: $steps.workspace.output.workspace.id
      expectedRevision: $steps.workspace.output.workspace.revision
      idempotencyKey: $input.idempotencyKey
  - name: inspect
    kind: tool
    tool: extensions_inspect
    input:
      installationId: $steps.workspace.output.installation.id
      operationId: $steps.build.output.id
  - name: handoff
    kind: transform
    output:
      installationId: $steps.workspace.output.installation.id
      operationId: $steps.build.output.id
      state: $steps.inspect.output
      openUrl: $steps.workspace.output.openUrl
      nextStep: Inspect the build result. Request approval for its verified release with extensions_release. A user must approve that exact release before activation.
