[project]
name = "ezcorp-factory-runner"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = ["jsonschema==4.25.1"]

[dependency-groups]
dev = [
    "coverage==7.13.1",
    "mypy==1.18.2",
    "ruff==0.12.11",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
line-length = 120

# Correctness-first selection. `I` (import order), `S` (subprocess heuristics),
# and `E5` (line length) are deliberately NOT selected yet: they fail today on
# c02_runner.py, which W02 owns. They are recorded as W18 backlog rather than
# silenced with a per-file ignore, so enabling them stays a visible decision.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "UP", "B", "C4", "SIM", "RET", "PIE", "PTH", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# `relative_files` makes coverage.py record repository-relative paths, so the
# emitted LCOV carries `SF:src/factory/runner/python/...` and merges with the
# Bun and Node reports without a path-rewriting step. scripts/python-quality.sh
# runs coverage from the repository root for exactly this reason.
[tool.coverage.run]
branch = true
relative_files = true
source = ["src/factory/runner/python"]
omit = ["src/factory/runner/python/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
