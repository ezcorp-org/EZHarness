[project]
name = "ezcorp-reference-image"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = ["coverage==7.13.1", "mypy==1.18.2", "ruff==0.12.11"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "W", "F", "I", "S", "UP", "B", "C4", "SIM", "RET", "PIE", "PTH", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/factory/reference-image/python"]
omit = ["src/factory/reference-image/python/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
