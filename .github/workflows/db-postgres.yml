# External-Postgres (Bun.sql) integration job.
#
# The rest of the DB suite runs against PGlite, so connection.ts's
# initPostgres() driver-specific code — the jsonb mapToDriverValue identity
# patch, the execute() array→{rows} wrapper, the pg_advisory_lock migrate
# guard, repairDoubleEncodedJsonb, the Bun.sql pool close, rawQuery via the
# real $client.unsafe, and the 23505 unique-violation error shape — never
# executed in CI. Four documented live incidents were exactly this class of
# PGlite-vs-Bun.sql difference. This job stands up a real postgres:15 + pgvector
# server and runs the DATABASE_URL-gated suite in
# src/__tests__/db-migration-postgres.test.ts against it (migrate() fresh +
# idempotent under the advisory lock, plus the initPostgres() surface above).
#
# NOTE FOR MAINTAINERS: workflow files are CODEOWNERS-owned. This is a NEW,
# additive job — it does not touch any existing gate (coverage thresholds,
# EXCLUDES, gate-integrity). It needs a human review to land.
#
# W18: the W00 audit (discrepancy 12) found five real-PostgreSQL suites that
# ran in NO producer at all — factory-budgets, factory-encryption-s3,
# factory-inbox, factory-project-creation, and factory-records. They are now in
# the real storage step below, after setup-factory-storage.sh has exported the
# credential directory, because factory-encryption-s3 writes real objects.
# scripts/factory-postgres-suite-registration.test.ts derives the requirement
# from tests/postgres/ on disk, so the next unregistered suite fails closed
# instead of waiting for another audit.
#
# W04a adds `factory-archive-writer` to the assurance and release job: the
# archive-writer role needs the ordinary S3 service for the material bytes it
# archives and the separately credentialed archive service for the immutable
# recovery set, and that job already starts both.
#
# W18 also split the assurance and release producers into their own job so the
# C11 required check `Factory assurance and release` names a real producer set
# rather than hiding inside a bundled job. GitHub Actions cannot share one
# `services:` block between jobs and has no YAML anchors, so the PostgreSQL
# service declaration below is necessarily repeated once.

name: db-postgres

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: db-postgres-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  external-postgres:
    name: External Postgres (Bun.sql)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # pgvector on top of the documented PostgreSQL 15 floor — migrate()
        # creates the `vector` extension + HNSW indexes, which need pgvector.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ezcorp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # connection.ts captures DATABASE_URL at module load, so it must be set
      # for the whole test process to select external (Bun.sql) mode.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ezcorp_test
      FACTORY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/ezcorp_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Targeted, single-file run (safe per scripts/test.sh — only the
      # unbounded root glob deadlocks). The file's PGlite suite runs too and
      # keeps passing; the DATABASE_URL-gated suite executes against the real
      # server instead of being skipped — now including a tx.execute() (inside
      # db.transaction()) assertion that ONLY the real bun-sql driver can
      # prove, since drizzle hands that callback a brand-new transaction
      # object rather than `db` itself.
      #
      # Deliberately NOT added here: the two settings regression suites
      # (query-core-settings-upsert-race, settings-jsonb-roundtrip). They call
      # mockDbConnection() unconditionally, so they run against PGlite
      # regardless of DATABASE_URL and already run in the standard backend
      # pool. Listing them in a job named "External Postgres (Bun.sql)" would
      # imply real-driver verification they do not provide.
      - name: Run external-Postgres DB suite
        run: bun test src/__tests__/db-migration-postgres.test.ts

      # A separate process is necessary because connection.ts captures the
      # pool size at module load. This keeps the normal-pool suite above and
      # runs the exact DB_POOL_MAX=1 lifecycle under the existing 60s real
      # initialization hook plus Bun's unchanged 5s test budget.
      - name: Run one-connection Postgres migration lifecycle
        env:
          DB_POOL_MAX: "1"
        run: bun test ./tests/postgres/pool-one.test.ts

      - name: Run pool service PostgreSQL and Node mTLS coverage producer
        env:
          COV_OUT: coverage-factory-pool
        run: bash scripts/factory-pool-coverage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-cov-factory-pool
          path: coverage-factory-pool/lcov.info
          retention-days: 3
          if-no-files-found: error

      - name: Measure recoverable compute admission against PostgreSQL and pool HTTPS
        env:
          COV_OUT: coverage-factory-compute-admissions
        run: bash scripts/factory-compute-admissions-coverage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-cov-factory-compute-admissions
          path: coverage-factory-compute-admissions/lcov.info
          retention-days: 3
          if-no-files-found: error

      - name: Measure factory provisioning against real PostgreSQL
        run: FACTORY_TEST_POSTGRES_URL="$DATABASE_URL" COV_OUT=coverage-factory-provisioning bash scripts/factory-provisioning-coverage.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-cov-factory-provisioning
          path: coverage-factory-provisioning/lcov.info
          retention-days: 3
          if-no-files-found: error

      # Reuse the strict local Compose provisioner: it creates job-local
      # credentials below a private runtime directory, starts SeaweedFS, and
      # seeds versioned tenant buckets without exposing credential values.
      - name: Start factory object storage
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/factory-storage-runtime"
          install -d -m 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          setup_output="$(scripts/setup-factory-storage.sh up)"
          storage_dir="$(printf '%s\n' "$setup_output" | sed -n 's#^Factory local storage is ready. Credentials are in \(.*\) below.*#\1#p')"
          test -n "$storage_dir"
          test -d "$storage_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "EZCORP_FACTORY_STORAGE_SECRETS_DIR=$storage_dir" >> "$GITHUB_ENV"

      # Explicit files preserve each real storage and private-service proof.
      - name: Run factory storage and private services on Postgres and S3
        shell: bash
        run: >-
          FACTORY_TEST_POSTGRES_URL="$DATABASE_URL" bun test --timeout 30000
          --coverage --coverage-reporter=lcov --coverage-dir=coverage-factory-storage
          ./tests/postgres/factory-artifacts.test.ts
          ./tests/postgres/factory-artifact-access.test.ts
          ./tests/postgres/factory-artifact-materials.test.ts
          ./tests/postgres/factory-lazy-input.test.ts
          ./tests/postgres/factory-lazy-commands.test.ts
          ./tests/postgres/factory-boot.test.ts
          ./tests/postgres/factory-run-lifecycle-s3.test.ts
          ./tests/postgres/factory-run-inputs.test.ts
          ./tests/postgres/factory-definitions.test.ts
          ./tests/postgres/factory-private-service.test.ts
          ./tests/postgres/factory-package-preparation.test.ts
          ./tests/postgres/factory-executions.test.ts
          ./tests/postgres/factory-attempt-queue.test.ts
          ./tests/postgres/factory-budgets.test.ts
          ./tests/postgres/factory-encryption-s3.test.ts
          ./tests/postgres/factory-inbox.test.ts
          ./tests/postgres/factory-project-creation.test.ts
          ./tests/postgres/factory-records.test.ts
          ./tests/postgres/factory-execution-gateway.test.ts
          ./tests/postgres/factory-host-launch.test.ts
          ./tests/postgres/factory-guest-model-journal.test.ts
          ./tests/postgres/factory-service-credentials.test.ts
          ./tests/postgres/factory-grants.test.ts
          ./tests/postgres/factory-task-stops.test.ts
          ./tests/postgres/factory-migration-restart.test.ts
          ./tests/postgres/factory-schema.test.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-cov-factory-storage
          path: coverage-factory-storage/lcov.info
          retention-days: 3
          if-no-files-found: error

      - name: Stop factory object storage
        if: always()
        shell: bash
        run: scripts/setup-factory-storage.sh down

  # C11 lane 4 of 7: protected evidence, exact authorization, provider-adapter
  # conformance, and the F04 races. Real engine plus real object storage; these
  # suites previously ran inside `External Postgres (Bun.sql)`, so no required
  # check carried the contract's lane name.
  factory-assurance-release:
    name: Factory assurance and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ezcorp_assurance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ezcorp_assurance
      FACTORY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/ezcorp_assurance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Start factory object storage
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/factory-storage-runtime"
          install -d -m 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          setup_output="$(scripts/setup-factory-storage.sh up)"
          storage_dir="$(printf '%s\n' "$setup_output" | sed -n 's#^Factory local storage is ready. Credentials are in \(.*\) below.*#\1#p')"
          test -n "$storage_dir"
          test -d "$storage_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "EZCORP_FACTORY_STORAGE_SECRETS_DIR=$storage_dir" >> "$GITHUB_ENV"

      - name: Prove factory assurance against real PostgreSQL
        run: FACTORY_TEST_POSTGRES_URL="$DATABASE_URL" bun test --timeout 30000 ./tests/postgres/factory-assurance.test.ts

      - name: Run the release, authority, and protected-material producers on real PostgreSQL and S3
        shell: bash
        run: >-
          FACTORY_TEST_POSTGRES_URL="$DATABASE_URL" bun test --timeout 30000
          --coverage --coverage-reporter=lcov --coverage-dir=coverage-factory-assurance-release
          ./tests/postgres/factory-releases.test.ts
          ./tests/postgres/factory-release-authority.test.ts
          ./tests/postgres/factory-archive-writer.test.ts
          ./tests/postgres/factory-s3-publication.test.ts
          ./tests/postgres/factory-validator-materials.test.ts
          ./tests/postgres/factory-validator-multiclaim.test.ts
          ./tests/postgres/factory-child-artifacts.test.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-cov-factory-assurance-release
          path: coverage-factory-assurance-release/lcov.info
          retention-days: 3
          if-no-files-found: error

      - name: Stop factory object storage
        if: always()
        shell: bash
        run: scripts/setup-factory-storage.sh down
