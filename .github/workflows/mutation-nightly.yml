name: Mutation (nightly, full suite)

# The full-suite counterpart to ci.yml's diff-scoped `Mutation (changed files)`
# job. A PR only ever mutates the files it touched, so nothing would otherwise
# re-check a module whose tests rotted under an unrelated change. This runs the
# whole mutation.mutateGlobs set.
#
# MUTATION ONLY. This workflow used to also run the full-repo CRAP ratchet and
# the global coverage floor, rebuilding coverage/lcov.info first with a
# standalone `bun run test:coverage`. That rebuild can never succeed here: the
# browser-route coverage receipt it requires (BROWSER_COVERAGE_RAW/LCOV) is
# produced by ci.yml's e2e jobs, so the merge never ran and both gates died on
# a missing lcov — five nights out of five. Those gates now run where the
# merged lcov actually exists: the full-repo CRAP ratchet is a main-push-only
# step in ci.yml's `Per-file coverage gate` job, and the coverage floor already
# ran there on every PR and push. Do not re-add a coverage rebuild here.
#
# Thresholds come from scripts/quality-gates.json — never hardcode one here.

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: the top of the hour is the busiest
    # slot on GitHub's shared scheduler and delays a long job the most.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the workflow on a below-threshold score (default: report only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never stack nightly runs — a full mutation pass can outlive its interval.
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  mutation-full:
    name: Full mutation suite
    runs-on: ubuntu-latest
    # Generous: the whole web/src/lib/** set is far larger than a PR diff.
    # Measured ~6 min for 6 files on a loaded 32-core box; a 2-core runner is
    # slower, and this must not be killed mid-run by a tight cap.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version # single pin source, matches ci.yml
      # StrykerJS 10 requires Node >= 22; the vitest runner is a Node process.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # web is NOT a bun workspace — see the same note in ci.yml.
      - run: bun install --cwd web --frozen-lockfile
      - run: bunx --bun svelte-kit sync
        working-directory: web

      # REPORT-ONLY UNTIL CALIBRATED — deliberate, and the PR gate is unaffected.
      # The full scope is the intersection of mutation.mutateGlobs with the
      # --coverage.include manifest, and that manifest carries a broad
      # `src/lib/**`, so 186 files qualify. "V8 is asked to report on it" is not
      # "a vitest test executes it", and every file in the gap comes back 100%
      # NoCoverage — which mutation.ts correctly refuses to score. The first runs
      # exist to name those files so they can be excluded or their tests fixed.
      # A nightly that is red on day one gets muted, and a muted gate gates
      # nothing. Promote to enforcing by flipping the default below once a run
      # is clean; the diff-scoped PR gate blocks for real in the meantime.
      #
      # --report-only suppresses ONLY a below-threshold score. A run that
      # produces no report at all — the initial test run timing out, a crashed
      # worker — still fails this step (scripts/mutation.ts, mutationExitCode).
      # It did not always: for five nights Stryker's 5-minute default dry-run
      # timeout killed the run at 186 files and this step went green over
      # nothing measured. web/stryker.config.json now sets dryRunTimeoutMinutes.
      #
      # `${{ inputs.enforce && '' || '--report-only' }}` was DEAD CODE and always
      # yielded --report-only: GitHub's `&&`/`||` return VALUES, so a truthy
      # `enforce` produced `''`, which is itself falsy, so `||` then handed back
      # the right operand every time. enforce=true, enforce=false and the
      # scheduled (null inputs) case were indistinguishable — the documented
      # promotion switch could never enforce, and would have failed silently.
      # Compare against the string instead of relying on truthiness.
      - name: Full mutation run
        env:
          # Decide in the shell, not in a GitHub expression. Scheduled runs have
          # no `inputs`, so this is empty then — which is the report-only path.
          ENFORCE: ${{ inputs.enforce }}
        run: |
          if [ "$ENFORCE" = "true" ]; then
            echo "enforce=true — a below-threshold score will FAIL this run"
            bun scripts/mutation.ts --full
          else
            bun scripts/mutation.ts --full --report-only
          fi

      # --expect names the gate this workflow ran. If the step above produced
      # no mutation.json the summary is FAIL with a finding that says so — it
      # must never report PASS over a run that measured nothing. (It did: the
      # summary read "PASS / No failures" on a night when every step had died.)
      - name: Quality summary
        if: always()
        run: bun scripts/quality-report.ts --text --limit 40 --expect mutation
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-nightly-reports
          path: coverage/quality
          retention-days: 14
