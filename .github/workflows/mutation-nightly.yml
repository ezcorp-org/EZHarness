name: Mutation (nightly, full suite)

# The full-suite counterpart to ci.yml's diff-scoped `Mutation (changed files)`
# job. A PR only ever mutates the files it touched, so nothing would otherwise
# re-check a module whose tests rotted under an unrelated change. This runs the
# whole mutation.mutateGlobs set.
#
# SHARDED, because the whole set does not fit one hosted runner. Measured
# 2026-09-20 (run 35523464554): 186 files instrumented to 18797 mutants, the
# initial test run took 6m38s, and mutation testing reached 99.4% at 5h52m —
# then the 6-hour job cap killed it, ~38 minutes short. Stryker also warned
# that 1028 static mutants (5% of the total) take ~93% of the time; enabling
# `ignoreStatic` would make one job fit, but it changes what the score
# measures, so that is a maintainer decision, not a workflow fix. Each matrix
# job mutates one deterministic slice (`mutation.ts --full --shard I/N`,
# round-robin over the sorted scope), uploads its report, and the `summary`
# job merges exactly N reports and decides the threshold verdict ONCE on the
# merged score (scripts/merge-mutation-reports.ts). A per-shard score is a
# slice of the tree and means nothing, so shards always run --report-only;
# an infrastructure failure inside a shard still fails that shard.
#
# MUTATION ONLY. This workflow used to also run the full-repo CRAP ratchet and
# the global coverage floor, rebuilding coverage/lcov.info first with a
# standalone `bun run test:coverage`. That rebuild can never succeed here: the
# browser-route coverage receipt it requires (BROWSER_COVERAGE_RAW/LCOV) is
# produced by ci.yml's e2e jobs, so the merge never ran and both gates died on
# a missing lcov — five nights out of five. Those gates now run where the
# merged lcov actually exists: the full-repo CRAP ratchet is a main-push-only
# step in ci.yml's `Per-file coverage gate` job, and the coverage floor already
# ran there on every PR and push. Do not re-add a coverage rebuild here.
#
# Thresholds come from scripts/quality-gates.json — never hardcode one here.

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: the top of the hour is the busiest
    # slot on GitHub's shared scheduler and delays a long job the most.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the workflow on a below-threshold merged score (default: report only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never stack nightly runs — a full mutation pass can outlive its interval.
  group: mutation-nightly
  cancel-in-progress: false

env:
  # How many slices the scope is cut into. The `shard` matrix below MUST list
  # exactly 0..MUTATION_SHARDS-1: the merge step refuses any other count of
  # reports, so a mismatch fails the run instead of scoring a partial tree.
  MUTATION_SHARDS: "6"

jobs:
  mutation-shard:
    name: Mutation shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # A slice is ~1/6 of the 6h38m whole; the cap stays generous so a shard
    # that draws the static-mutant-heavy files is not killed mid-run.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5] # 0..MUTATION_SHARDS-1, see env above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version # single pin source, matches ci.yml
      # StrykerJS 10 requires Node >= 22; the vitest runner is a Node process.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # web is NOT a bun workspace — see the same note in ci.yml.
      - run: bun install --cwd web --frozen-lockfile
      - run: bunx --bun svelte-kit sync
        working-directory: web

      # --report-only here suppresses ONLY Stryker's per-shard threshold exit,
      # which is meaningless for a slice; the merged verdict is decided in
      # `summary`. A run that produces no report at all — the initial test run
      # timing out, a crashed worker — still fails this step
      # (scripts/mutation.ts, mutationExitCode). It did not always: for five
      # nights Stryker's 5-minute default dry-run timeout killed the run and
      # this step went green over nothing measured. web/stryker.config.json
      # now sets dryRunTimeoutMinutes.
      - name: Mutate shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bun scripts/mutation.ts --full --shard "$SHARD/$MUTATION_SHARDS" --report-only
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-nightly-shard-${{ matrix.shard }}
          path: coverage/quality/mutation.json
          # A shard that died has no report. The merge below counts reports
          # and fails on a shortfall, so this must not add a second red here.
          if-no-files-found: warn
          retention-days: 3

  summary:
    name: Merge shards + quality summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [mutation-shard]
    # Runs even when a shard failed — that is exactly when the merge must say
    # "N-1 reports, not N" and the summary must read FAIL.
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-nightly-shard-*
          path: mutation-shards
      # REPORT-ONLY UNTIL CALIBRATED — deliberate, and the PR gate is unaffected.
      # The scope is the intersection of mutation.mutateGlobs with the
      # --coverage.include manifest, and that manifest carries a broad
      # `src/lib/**`, so 186 files qualify. "V8 is asked to report on it" is not
      # "a vitest test executes it", and every file in the gap comes back 100%
      # NoCoverage — which the merge lists as a scope error. The first runs
      # exist to name those files so they can be excluded or their tests fixed.
      # A nightly that is red on day one gets muted, and a muted gate gates
      # nothing. Promote to enforcing by flipping the input default once a run
      # is clean; the diff-scoped PR gate blocks for real in the meantime.
      #
      # Decide in the shell, not in a GitHub expression: `inputs.enforce && ''
      # || '--x'` returns the RIGHT operand for every value (GitHub's `&&`/`||`
      # return values, and '' is falsy), which is how the old switch could
      # never enforce. Scheduled runs have no `inputs`, so ENFORCE is empty
      # then — the report-only path.
      - name: Merge shard reports
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          if [ "$ENFORCE" = "true" ]; then
            echo "enforce=true — a below-threshold merged score will FAIL this run"
            bun scripts/merge-mutation-reports.ts --shards "$MUTATION_SHARDS" --enforce "mutation-shards/*/mutation.json"
          else
            bun scripts/merge-mutation-reports.ts --shards "$MUTATION_SHARDS" "mutation-shards/*/mutation.json"
          fi
      # --expect names the gate this workflow ran. If the merge above wrote no
      # mutation.json the summary is FAIL with a finding that says so — it must
      # never report PASS over a run that measured nothing. (It did: the
      # summary read "PASS / No failures" on a night when every step had died.)
      - name: Quality summary
        if: always()
        run: bun scripts/quality-report.ts --text --limit 40 --expect mutation
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-nightly-reports
          path: coverage/quality
          retention-days: 14
