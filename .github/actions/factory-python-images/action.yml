name: "Pinned factory Python images"
description: >
  Put the pinned CPython base and the pinned PyArrow data image
  (localhost/ezcorp-factory-python-data) on the runner, for the suites that
  run them. The references come from the files the suites read
  (DEFAULT_PYTHON_IMAGE and src/factory/reference-data/image/pinned.json),
  never from this file: scripts/setup-factory-python-images.ts pulls the base
  by digest and builds the data image from the committed recipe, which fails
  when the build does not reproduce the pinned digest. The recipe's closure is
  exported from uv.lock by the pinned uv, which this action installs itself so
  it does not depend on the job's step order. Needs podman first
  (scripts/setup-extension-runner-ci.sh --install).

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-python-toolchain
    - name: Pull the pinned base and build the pinned data image
      shell: bash
      run: bun scripts/setup-factory-python-images.ts
