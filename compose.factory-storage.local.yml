# Local-only factory storage profile. This does not prove independent replication
# or failure domains because both services run on the same host.
#
# Memory (W15d, measured 2026-09-25 from each container's cgroup, sampled every second):
# under the PostgreSQL checkpoint and restore suites, one W19a mock pass, and the
# db-postgres.yml storage step at once, the ordinary store peaked at 1263 MiB
# (739 MiB anonymous, the rest page cache) and the archive store at 247 MiB
# (225 MiB anonymous); neither container had an OOM kill. 2g stays. The OOM kills of
# Sep 23 (ordinary) and Sep 25 (archive) were host-wide, not these limits: see
# docs/factory-local-storage.md, "Memory and the host OOM killer".
services:
  factory-storage-ordinary:
    profiles: ["factory-storage"]
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    image: docker.io/chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    # -volume.max=400 (W15d): 400 x 64 MiB = 25 GiB at most. On 2026-09-25 the store held
    # 308 of 400 volumes (16.95 GiB, every key a proof run's leftover); at 400 every upload
    # fails with "failed to find writable volumes". Proof runs now remove their own objects.
    # The ceiling must keep the host above its 100 GB disk floor at recreate time, so it is
    # raised only after the reviewed-manifest prune of the backlog lands, with the free space
    # measured then. A raise to 600 (37.5 GiB) would have taken the host from 106 GB to about 86 GB.
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-master.telemetry=false", "-master.volumeSizeLimitMB=64", "-volume.max=400", "-s3", "-s3.config=/config/ordinary.json"]
    ports:
      - "${EZCORP_FACTORY_STORAGE_BIND_IP:-127.0.0.1}:${EZCORP_FACTORY_STORAGE_ORDINARY_S3_PORT:-18333}:8333"
      - "${EZCORP_FACTORY_STORAGE_BIND_IP:-127.0.0.1}:${EZCORP_FACTORY_STORAGE_ORDINARY_ADMIN_PORT:-19333}:9333"
    volumes:
      - factory-storage-ordinary-data:/data
      - ${EZCORP_FACTORY_STORAGE_SECRETS_DIR:?run scripts/setup-factory-storage.sh first}/ordinary.json:/config/ordinary.json:ro
    healthcheck:
      test: ["CMD-SHELL", "response=$$(wget -S -O /dev/null http://127.0.0.1:8333 2>&1 || true); case \"$$response\" in *\"403 Forbidden\"*) exit 0;; *) exit 1;; esac"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  factory-storage-archive:
    profiles: ["factory-storage"]
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    image: docker.io/chrislusf/seaweedfs@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-master.telemetry=false", "-master.volumeSizeLimitMB=64", "-volume.max=400", "-s3", "-s3.config=/config/archive.json"]
    ports:
      - "${EZCORP_FACTORY_STORAGE_BIND_IP:-127.0.0.1}:${EZCORP_FACTORY_STORAGE_ARCHIVE_S3_PORT:-18334}:8333"
      - "${EZCORP_FACTORY_STORAGE_BIND_IP:-127.0.0.1}:${EZCORP_FACTORY_STORAGE_ARCHIVE_ADMIN_PORT:-19334}:9333"
    volumes:
      - factory-storage-archive-data:/data
      - ${EZCORP_FACTORY_STORAGE_SECRETS_DIR:?run scripts/setup-factory-storage.sh first}/archive.json:/config/archive.json:ro
    healthcheck:
      test: ["CMD-SHELL", "response=$$(wget -S -O /dev/null http://127.0.0.1:8333 2>&1 || true); case \"$$response\" in *\"403 Forbidden\"*) exit 0;; *) exit 1;; esac"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

volumes:
  factory-storage-ordinary-data:
  factory-storage-archive-data:
