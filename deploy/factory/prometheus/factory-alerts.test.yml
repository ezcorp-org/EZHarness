        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Referenced interpreter/package runner unavailable for 60 seconds
              action: Restore the pinned compatible deployment or fail/hold affected runs; never route to incompatible code
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryRequiredRunnerUnavailable: a package not ready for 2 minutes"
    interval: 15s
    input_series:
