# Generated from src/factory/observability/alert-rules.ts (W4H-34, C11). Do not edit; the drift test pins it.
rule_files:
  - factory-alerts.yml
evaluation_interval: 15s
tests:
  - name: "FactoryReadyWorkStalled: ready work waiting 31 s"
    interval: 15s
    input_series:
      - series: factory_ready_work_oldest_age_seconds{job="factory-harness",instance="harness:9464"}
        values: 31x8
      - series: factory_runs_without_progress{job="factory-harness",instance="harness:9464"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryReadyWorkStalled
        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Ready work age over 30 seconds or no progress for 60 seconds with no declared wait
              action: Inspect blocking resource/lease, queue fairness, and healthy spare capacity; never force-release an uncertain holder
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryReadyWorkStalled: a run with no progress"
    interval: 15s
    input_series:
      - series: factory_ready_work_oldest_age_seconds{job="factory-harness",instance="harness:9464"}
        values: "0x8"
      - series: factory_runs_without_progress{job="factory-harness",instance="harness:9464"}
        values: 1x8
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryReadyWorkStalled
        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Ready work age over 30 seconds or no progress for 60 seconds with no declared wait
              action: Inspect blocking resource/lease, queue fairness, and healthy spare capacity; never force-release an uncertain holder
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryReadyWorkStalled: at the 30 s threshold"
    interval: 15s
    input_series:
      - series: factory_ready_work_oldest_age_seconds{job="factory-harness",instance="harness:9464"}
        values: 30x8
      - series: factory_runs_without_progress{job="factory-harness",instance="harness:9464"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryReadyWorkStalled
        exp_alerts: []
  - name: "FactoryProjectionLagging: lag 11 s held for 2 minutes"
    interval: 15s
    input_series:
      - series: factory_projection_lag_seconds{job="factory-harness",instance="harness:9464"}
        values: 11x12
    alert_rule_test:
      - eval_time: 2m
        alertname: FactoryProjectionLagging
        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Projection gap/lag over 10 seconds for 60 seconds
              action: Check audit/outbox consumer, recover missing sequence, rebuild from a verified cursor
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryProjectionLagging: lag 11 s held for 45 s only"
    interval: 15s
    input_series:
      - series: factory_projection_lag_seconds{job="factory-harness",instance="harness:9464"}
        values: 11x3
    alert_rule_test:
      - eval_time: 45s
        alertname: FactoryProjectionLagging
        exp_alerts: []
  - name: "FactoryProjectionLagging: at the 10 s threshold"
    interval: 15s
    input_series:
      - series: factory_projection_lag_seconds{job="factory-harness",instance="harness:9464"}
        values: 10x12
    alert_rule_test:
      - eval_time: 2m
        alertname: FactoryProjectionLagging
        exp_alerts: []
  - name: "FactoryProjectionLagging: a missing batch held for 2 minutes"
    interval: 15s
    input_series:
      - series: factory_projection_lag_seconds{job="factory-harness",instance="harness:9464"}
        values: 2x12
      - series: factory_projection_gap_runs{job="factory-harness",instance="harness:9464"}
        values: 1x12
    alert_rule_test:
      - eval_time: 2m
        alertname: FactoryProjectionLagging
        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Projection gap/lag over 10 seconds for 60 seconds
              action: Check audit/outbox consumer, recover missing sequence, rebuild from a verified cursor
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryValidatorDigestErroring: one digest erroring"
    interval: 15s
    input_series:
      - series: factory_validator_digests_erroring{job="factory-harness",instance="harness:9464"}
        values: 1x8
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryValidatorDigestErroring
        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Three consecutive validator errors for one digest
              action: Quarantine that evaluator for new acceptance; repair/revalidate explicitly
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryValidatorDigestErroring: none erroring"
    interval: 15s
    input_series:
      - series: factory_validator_digests_erroring{job="factory-harness",instance="harness:9464"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryValidatorDigestErroring
