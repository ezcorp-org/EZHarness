        values: 1x8
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryUsageUnknownOrBudgetExhausted
        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Unknown spend or exhausted budget
              action: Stop paid dispatch; reconcile usage or obtain a new explicit allocation within authority
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryUsageUnknownOrBudgetExhausted: neither"
    interval: 15s
    input_series:
      - series: factory_usage_unknown_reservations{job="factory-harness",instance="harness:9464"}
        values: "0x8"
      - series: factory_budget_exhausted_envelopes{job="factory-harness",instance="harness:9464"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryUsageUnknownOrBudgetExhausted
        exp_alerts: []
  - name: "FactoryReleaseUncertain: uncertain for 61 s"
    interval: 15s
    input_series:
      - series: factory_release_uncertain_oldest_age_seconds{job="factory-harness",instance="harness:9464"}
        values: 61x8
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryReleaseUncertain
        exp_alerts:
          - exp_labels:
              job: factory-harness
              instance: harness:9464
              severity: page
            exp_annotations:
              summary: Uncertain release for over 60 seconds
              action: Open the operator inbox with the exact request/receipt lookup; do not auto-retry
              runbook: docs/factory-deployment.md#c11-alerts-and-operator-actions
  - name: "FactoryReleaseUncertain: at the 60 s threshold"
    interval: 15s
    input_series:
      - series: factory_release_uncertain_oldest_age_seconds{job="factory-harness",instance="harness:9464"}
        values: 60x8
    alert_rule_test:
      - eval_time: 1m
        alertname: FactoryReleaseUncertain
