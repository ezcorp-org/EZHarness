  - name: "FactoryRequiredRunnerUnavailable: an interpreter build unavailable for 2 minutes"
    interval: 15s
    input_series:
      - series: factory_interpreter_builds_unavailable{job="factory-harness",instance="harness:9464"}
        values: 1x12
