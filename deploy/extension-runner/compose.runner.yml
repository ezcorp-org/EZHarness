services:
  app:
    extends:
      file: compose.app.yml
      service: app
    environment:
      EZCORP_EXTENSION_RUNNER_SOCKET: /run/ez-extension-runner/runner.sock
      EZCORP_EXTENSION_RUNNER_TOKEN_FILE: /run/secrets/extension-runner-token
    volumes:
      - type: bind
        source: ${EZ_RUNNER_SOCKET_DIR:-/run/ez-extension-runner}
        target: /run/ez-extension-runner
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EZ_RUNNER_TOKEN_FILE:-/etc/ezharness/extension-runner-token}
        target: /run/secrets/extension-runner-token
        read_only: true
        bind:
          create_host_path: false
